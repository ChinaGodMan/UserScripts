name: "reminder"

on:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  reminder:
    permissions:
      issues: write # for agrc/create-reminder-action to set reminders on issues
      pull-requests: write # for agrc/create-reminder-action to set reminders on PRs
    runs-on: ubuntu-latest

    steps:
      - name: check for reminder
        uses: agrc/create-reminder-action@e694d5c2c66a34319815e61df43759d25da68d70 # v1.1.27
